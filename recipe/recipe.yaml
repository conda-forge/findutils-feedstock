schema_version: 1

context:
  version: "4.11.0"

package:
  name: findutils
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/findutils/findutils-${{ version }}.tar.xz
  sha256: bfd19cb06cc71f3352d567e90284d8cdac02ac89774bbeadf0b533b0c11432fd

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - gettext-tools
    - autoconf
    - automake
    - python >= ${{ python_min }}
    - sed
    - texinfo
    - xz-tools
  host:
    - if: osx
      then: libintl-devel

tests:
  - script:
      - find --version
      - find --help
      - locate --version
      - locate --help
      - updatedb --version
      - updatedb --help
      - xargs --version
      - xargs --help

about:
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: |
    The GNU Find Utilities are the basic directory searching utilities of
    the GNU operating system.
  description: |
    The GNU Find Utilities are the basic directory searching utilities of
    the GNU operating system. These programs are typically used in conjunction
    with other programs to provide modular and powerful directory search and
    file locating capabilities to other commands.


  homepage: https://www.gnu.org/software/findutils/
  repository: http://savannah.gnu.org/projects/findutils/
  documentation: https://www.gnu.org/software/findutils/manual/find.html

extra:
  recipe-maintainers:
    - danielnachun
    - karl616
    - jonashaag
